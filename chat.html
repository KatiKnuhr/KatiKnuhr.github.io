        // ══════════════════════════════════════════════════════════
        // RECENT EMOJIS  (localStorage)
        // ══════════════════════════════════════════════════════════
        const RECENT_KEY = 'kati_recent_emojis';
        const RECENT_MAX = 32;   // max. gespeicherte Emojis

        function loadRecentEmojis() {
            try {
                return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
            } catch { return []; }
        }

        function saveRecentEmoji(emoji) {
            let recent = loadRecentEmojis();
            // Duplikat entfernen, vorne einfügen
            recent = [emoji, ...recent.filter(e => e !== emoji)];
            // Auf Max begrenzen
            if (recent.length > RECENT_MAX) recent = recent.slice(0, RECENT_MAX);
            localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
            // Kategorie aktualisieren
            EMOJI_CATEGORIES[0].emojis = recent;
            // Falls gerade Recent-Tab aktiv → Grid neu rendern
            if (activeCategory === 0) renderEmojiGrid(0);
        }

        // ══════════════════════════════════════════════════════════
        // EMOJI PICKER
        // ══════════════════════════════════════════════════════════
        let activeCategory = 0;
        let emojiPickerOpen = false;

        function buildEmojiPicker() {
            // Recent aus localStorage laden
            EMOJI_CATEGORIES[0].emojis = loadRecentEmojis();

            const tabsEl = document.getElementById('emoji-tabs');
            tabsEl.innerHTML = '';

            EMOJI_CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'emoji-tab' + (idx === 0 ? ' active recent-tab' : '');
                btn.textContent = cat.label;
                btn.title = cat.name;
                btn.onclick = () => switchCategory(idx);
                tabsEl.appendChild(btn);
            });

            renderEmojiGrid(0);
            updateCatLabel(0);
        }

        function switchCategory(idx) {
            activeCategory = idx;
            document.querySelectorAll('.emoji-tab').forEach((t, i) =>
                t.classList.toggle('active', i === idx)
            );
            renderEmojiGrid(idx);
            updateCatLabel(idx);
        }

        function updateCatLabel(idx) {
            document.getElementById('emoji-cat-label').textContent =
                EMOJI_CATEGORIES[idx].name;
        }

        function renderEmojiGrid(idx) {
            const gridEl = document.getElementById('emoji-grid');
            gridEl.innerHTML = '';

            const emojis = EMOJI_CATEGORIES[idx].emojis;

            if (emojis.length === 0) {
                // Noch keine Recent-Emojis
                const empty = document.createElement('div');
                empty.className = 'emoji-empty';
                empty.textContent = '🕐 Noch keine zuletzt verwendeten Emojis';
                gridEl.appendChild(empty);
                return;
            }

            emojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'emoji-btn';
                btn.textContent = emoji;
                btn.onclick = () => insertEmoji(emoji);
                gridEl.appendChild(btn);
            });
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('msg-input');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value =
                input.value.slice(0, start) + emoji + input.value.slice(end);
            const newPos = start + [...emoji].length; // korrekte Unicode-Länge
            input.setSelectionRange(newPos, newPos);
            input.focus();
            autoResize(input);

            // ✅ Als zuletzt verwendet speichern
            saveRecentEmoji(emoji);
        }

        function toggleEmojiPicker() {
            emojiPickerOpen = !emojiPickerOpen;
            document.getElementById('emoji-picker')
                .classList.toggle('open', emojiPickerOpen);
            document.getElementById('emoji-toggle-btn')
                .classList.toggle('active', emojiPickerOpen);

            // Beim Öffnen immer Recent-Tab zeigen & aktualisieren
            if (emojiPickerOpen) {
                EMOJI_CATEGORIES[0].emojis = loadRecentEmojis();
                switchCategory(0);
            }
        }

        // Picker schließen wenn außerhalb geklickt
        document.addEventListener('click', e => {
            if (!emojiPickerOpen) return;
            const picker = document.getElementById('emoji-picker');
            const btn = document.getElementById('emoji-toggle-btn');
            if (!picker.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
                emojiPickerOpen = false;
                picker.classList.remove('open');
                btn.classList.remove('active');
            }
        });

        // ══════════════════════════════════════════════════════════
        // CONTACTS
        // ══════════════════════════════════════════════════════════
        async function loadContacts() {
            await waitForFirebase();
            const { collection, getDocs, where, query } = window._firebaseFns;
            const db = window._db;

            const snap = await getDocs(
                query(collection(db, 'users'), where('status', '==', 'approved'))
            );

            allUsers = [];
            snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));

            if (myRole === 'admin' && !allUsers.find(u => u.uid === 'admin')) {
                allUsers.unshift({ uid: 'admin', name: 'Kati (Admin)', email: '' });
            }

            document.getElementById('sidebar-sub').textContent =
                allUsers.length + ' Teilnehmer';

            renderContactList();
            listenUnreadCounts();
            buildEmojiPicker();
        }

        function renderContactList() {
            const list = document.getElementById('contact-list');
            list.innerHTML = '';

            list.appendChild(createContactItem({
                id: 'group_all', name: '🏠 Mentlberg-WG',
                sub: 'Alle Mitglieder', isGroup: true
            }));

            const sep = document.createElement('div');
            sep.style.cssText =
                'height:1px;background:rgba(255,255,255,0.07);margin:6px 0;';
            list.appendChild(sep);

            const myId = myRole === 'admin' ? 'admin' : myUid;
            allUsers.forEach(user => {
                if (user.uid === myId) return;
                const chatId = getPrivateChatId(myId, user.uid);
                list.appendChild(createContactItem({
                    id: chatId, name: user.name,
                    sub: '💬 Privater Chat', isGroup: false,
                    initial: user.name.charAt(0)
                }));
            });
        }

        function createContactItem({ id, name, sub, isGroup, initial }) {
            const div = document.createElement('div');
            div.className = 'contact-item';
            div.id = 'contact-' + id;
            div.onclick = () => openChat(id, name, isGroup);
            div.innerHTML = `
            <div class="contact-avatar ${isGroup ? 'group' : ''}">
                ${isGroup ? '🏠' : (initial || '?')}
            </div>
            <div class="contact-info">
                <div class="contact-name">${name}</div>
                <div class="contact-preview" id="preview-${id}">–</div>
            </div>
            <div class="contact-meta">
                <div class="contact-time" id="time-${id}"></div>
                <div class="unread-badge" id="unread-${id}">0</div>
            </div>`;
            return div;
        }

        // ── Unread ────────────────────────────────────────────────
        function listenUnreadCounts() {
            const { collection, query, orderBy, onSnapshot } = window._firebaseFns;
            const db = window._db;
            const myId = myRole === 'admin' ? 'admin' : myUid;

            const chatIds = ['group_all'];
            allUsers.forEach(u => {
                if (u.uid !== myId) chatIds.push(getPrivateChatId(myId, u.uid));
            });

            chatIds.forEach(chatId => {
                if (unreadListeners[chatId]) return;
                const q = query(
                    collection(db, 'chats', chatId, 'messages'),
                    orderBy('createdAt', 'desc')
                );
                unreadListeners[chatId] = onSnapshot(q, snap => {
                    if (snap.empty) return;
                    const latest = snap.docs[0].data();
                    const previewEl = document.getElementById('preview-' + chatId);
                    const timeEl = document.getElementById('time-' + chatId);
                    const unreadEl = document.getElementById('unread-' + chatId);

                    if (previewEl && latest.text) {
                        const sender = latest.senderName === myName ? 'Du' : latest.senderName;
                        previewEl.textContent = sender + ': ' + latest.text;
                    }
                    if (timeEl && latest.createdAt) {
                        timeEl.textContent = formatTime(latest.createdAt.toDate());
                    }
                    if (chatId !== currentChatId && unreadEl) {
                        let count = 0;
                        snap.docs.forEach(d => {
                            const data = d.data();
                            if (data.senderUid !== myId &&
                                !(data.readBy || []).includes(myId)) count++;
                        });
                        unreadEl.textContent = count > 99 ? '99+' : count;
                        unreadEl.style.display = count > 0 ? 'block' : 'none';
                    }
                });
            });
        }

        // ── Chat öffnen ───────────────────────────────────────────
        function openChat(chatId, chatName, isGroup) {
            if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }

            currentChatId = chatId;
            currentChatName = chatName;

            document.querySelectorAll('.contact-item')
                .forEach(el => el.classList.remove('active'));
            const item = document.getElementById('contact-' + chatId);
            if (item) item.classList.add('active');

            const unreadEl = document.getElementById('unread-' + chatId);
            if (unreadEl) unreadEl.style.display = 'none';

            const headerAvatar = document.getElementById('chat-header-avatar');
            headerAvatar.textContent = isGroup ? '🏠' : chatName.charAt(0).toUpperCase();
            headerAvatar.className = 'chat-header-avatar' + (isGroup ? ' group' : '');
            document.getElementById('chat-header-name').textContent = chatName;
            document.getElementById('chat-header-sub').textContent =
                isGroup ? '👥 Gruppen-Chat · alle Mitglieder' : '🔒 Privater Chat';

            document.getElementById('chat-placeholder').style.display = 'none';
            document.getElementById('chat-header').classList.add('visible');
            document.getElementById('input-area').classList.add('visible');
            document.getElementById('messages-container').innerHTML =
                '<div class="spinner">⏳ Lade Nachrichten...</div>';

            // Emoji-Picker schließen
            emojiPickerOpen = false;
            document.getElementById('emoji-picker').classList.remove('open');
            document.getElementById('emoji-toggle-btn').classList.remove('active');

            document.getElementById('sidebar').classList.add('hidden-mobile');
            document.getElementById('chat-area').classList.add('visible-mobile');

            listenMessages(chatId);
        }

        // ── Nachrichten ───────────────────────────────────────────
        function listenMessages(chatId) {
            const { collection, query, orderBy, onSnapshot, doc, updateDoc } =
                window._firebaseFns;
            const db = window._db;
            const myId = myRole === 'admin' ? 'admin' : myUid;

            const q = query(
                collection(db, 'chats', chatId, 'messages'),
                orderBy('createdAt', 'asc')
            );

            unsubscribeMessages = onSnapshot(q, snap => {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';

                if (snap.empty) {
                    container.innerHTML =
                        '<div class="spinner" style="color:rgba(255,255,255,0.3)">' +
                        'Noch keine Nachrichten. Schreib etwas! 👋</div>';
                    return;
                }

                let lastDate = null;
                let lastSenderUid = null;

                snap.docs.forEach(d => {
                    const data = d.data();
                    const isOwn = data.senderUid === myId;
                    const ts = data.createdAt ? data.createdAt.toDate() : new Date();

                    const dateStr = ts.toLocaleDateString('de-DE',
                        { day: '2-digit', month: 'long', year: 'numeric' });
                    const todayStr = new Date().toLocaleDateString('de-DE',
                        { day: '2-digit', month: 'long', year: 'numeric' });

                    if (dateStr !== lastDate) {
                        const divider = document.createElement('div');
                        divider.className = 'date-divider';
                        divider.innerHTML =
                            `<span>${dateStr === todayStr ? '📅 Heute' : dateStr}</span>`;
                        container.appendChild(divider);
                        lastDate = dateStr;
                        lastSenderUid = null;
                    }

                    const showAvatar = data.senderUid !== lastSenderUid;
                    lastSenderUid = data.senderUid;

                    if (!isOwn) {
                        const readBy = data.readBy || [];
                        if (!readBy.includes(myId)) {
                            updateDoc(doc(db, 'chats', chatId, 'messages', d.id), {
                                readBy: [...readBy, myId]
                            }).catch(() => { });
                        }
                    }

                    const row = document.createElement('div');
                    row.className = 'message-row' + (isOwn ? ' own' : '');

                    const avatarHtml = `
                    <div class="msg-avatar ${showAvatar && !isOwn ? '' : 'hidden'}">
                        ${data.senderName ? data.senderName.charAt(0).toUpperCase() : '?'}
                    </div>`;

                    const senderLabel = (!isOwn && showAvatar)
                        ? `<div class="msg-sender-name">${data.senderName || 'Unbekannt'}</div>`
                        : '';

                    row.innerHTML = `
                    ${!isOwn ? avatarHtml : ''}
                    <div>
                        ${senderLabel}
                        <div class="message-bubble">
                            ${escapeHtml(data.text || '')}
                            <div class="msg-time">
                                ${formatTime(ts)}${isOwn ? ' ✓✓' : ''}
                            </div>
                        </div>
                    </div>
                    ${isOwn ? avatarHtml : ''}`;

                    container.appendChild(row);
                });

                container.scrollTop = container.scrollHeight;
            });
        }

        // ── Senden ────────────────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            try {
                await waitForFirebase();
                const { collection, addDoc, serverTimestamp } = window._firebaseFns;
                const db = window._db;
                const myId = myRole === 'admin' ? 'admin' : myUid;

                await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                    text, senderUid: myId, senderName: myName,
                    createdAt: serverTimestamp(),
                    readBy: [myId]
                });

                input.value = '';
                input.style.height = 'auto';
            } catch (e) {
                console.error('Fehler beim Senden:', e);
            }

            btn.disabled = false;
            input.focus();
        }

        // ── Helpers ───────────────────────────────────────────────
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function formatTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString('de-DE',
                { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '<br>');
        }

        function showSidebar() {
            document.getElementById('sidebar').classList.remove('hidden-mobile');
            document.getElementById('chat-area').classList.remove('visible-mobile');
        }

        // ── Start ─────────────────────────────────────────────────
        document.addEventListener('firebaseReady', loadContacts);
        if (window._firebaseReady) loadContacts();
    </script>
