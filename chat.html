<body>

    <div class="app">

        <div class="topbar">
            <div class="topbar-left">
                <a href="Mentlberg.html" class="back-btn">← Zurück</a>
                <span class="topbar-title">💬 Mentlberg-Chat</span>
            </div>
            <div class="topbar-user">
                <div class="user-avatar-top" id="topbar-avatar">?</div>
                <span class="user-name-top" id="topbar-name">...</span>
            </div>
        </div>

        <div class="main">

            <div class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <h2>💬 Chats</h2>
                </div>
                <div class="search-wrap">
                    <div class="search-box">
                        <span>🔍</span>
                        <input type="text" id="search-input"
                               placeholder="Suchen oder neuen Chat beginnen"
                               oninput="filterContacts(this.value)" />
                    </div>
                </div>
                <div class="contact-list" id="contact-list">
                    <div class="spinner">⏳ Lade Chats...</div>
                </div>
            </div>

            <div class="chat-area" id="chat-area">

                <div class="chat-placeholder" id="chat-placeholder">
                    <div class="ph-icon">💬</div>
                    <h3>Mentlberg-WG Chat</h3>
                    <p>Wähle einen Chat aus der Liste</p>
                </div>

                <div class="chat-header" id="chat-header">
                    <button class="back-to-contacts" onclick="showSidebar()">‹</button>
                    <div class="chat-header-avatar" id="chat-header-avatar">?</div>
                    <div class="chat-header-info">
                        <h3 id="chat-header-name">–</h3>
                        <p id="chat-header-sub">–</p>
                    </div>
                </div>

                <div class="messages-container" id="messages-container"></div>

                <div class="input-area" id="input-area">
                    <div class="emoji-picker" id="emoji-picker">
                        <div class="emoji-tabs" id="emoji-tabs"></div>
                        <div class="emoji-cat-label" id="emoji-cat-label">Zuletzt verwendet</div>
                        <div class="emoji-grid" id="emoji-grid"></div>
                    </div>
                    <div class="input-row">
                        <button class="input-icon-btn" id="emoji-toggle-btn"
                                onclick="toggleEmojiPicker()" title="Emoji">
                            😊
                        </button>
                        <div class="msg-input-wrap">
                            <textarea id="msg-input"
                                      placeholder="Nachricht schreiben..."
                                      rows="1"
                                      onkeydown="handleKey(event)"
                                      oninput="autoResize(this)"></textarea>
                        </div>
                        <button class="send-btn" id="send-btn"
                                onclick="sendMessage()" title="Senden">
                            ➤
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        /* ── AUTH ──────────────────────────────────────────────────────── */
        const myName = sessionStorage.getItem('kati_name') || localStorage.getItem('kati_name');
        const myUid = sessionStorage.getItem('kati_uid') || localStorage.getItem('kati_uid');
        const myRole = sessionStorage.getItem('kati_role') || localStorage.getItem('kati_role');
        const myEmail = sessionStorage.getItem('kati_email') || localStorage.getItem('kati_email') || '';

        if (!myName || (!myUid && myRole !== 'admin')) {
            window.location.href = 'start.html';
        }

        const topbarAvatar = document.getElementById('topbar-avatar');
        const topbarName = document.getElementById('topbar-name');
        topbarAvatar.textContent = myName ? myName.charAt(0).toUpperCase() : '?';
        topbarName.textContent = myName || 'Gast';
        if (myRole === 'admin') {
            topbarAvatar.style.background = 'linear-gradient(135deg,#1f6650,#25d366)';
        }

        /* ── STATE ─────────────────────────────────────────────────────── */
        let currentChatId = null;
        let currentChatName = null;
        let unsubMessages = null;
        let allUsers = [];
        let unreadListeners = {};
        let allContactData = [];

        function waitForFirebase() {
            return new Promise(r => {
                if (window._firebaseReady) r();
                else document.addEventListener('firebaseReady', r, { once: true });
            });
        }

        function getPrivateChatId(a, b) {
            return [a, b].sort().join('__');
        }

        function myId() {
            return myRole === 'admin' ? 'admin' : myUid;
        }

        /* ══════════════════════════════════════════════════════════════════
           EMOJI DATA

        const RECENT_KEY = 'kati_recent_emojis';
        const RECENT_MAX = 32;

        function loadRecentEmojis() {
            try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }
            catch { return []; }
        }

        function saveRecentEmoji(emoji) {
            let r = [emoji, ...loadRecentEmojis().filter(e => e !== emoji)];
            if (r.length > RECENT_MAX) r = r.slice(0, RECENT_MAX);
            localStorage.setItem(RECENT_KEY, JSON.stringify(r));
            EMOJI_CATEGORIES[0].emojis = r;
            if (activeCategory === 0) renderEmojiGrid(0);
        }

        let activeCategory = 0;
        let emojiPickerOpen = false;

        function buildEmojiPicker() {
            EMOJI_CATEGORIES[0].emojis = loadRecentEmojis();
            const tabsEl = document.getElementById('emoji-tabs');
            tabsEl.innerHTML = '';
            EMOJI_CATEGORIES.forEach((cat, idx) => {
                const btn = document.createElement('button');
                btn.className = 'emoji-tab' + (idx === 0 ? ' active' : '');
                btn.textContent = cat.label;
                btn.title = cat.name;
                btn.onclick = () => switchCategory(idx);
                tabsEl.appendChild(btn);
            });
            renderEmojiGrid(0);
            updateCatLabel(0);
        }

        function switchCategory(idx) {
            activeCategory = idx;
            document.querySelectorAll('.emoji-tab').forEach((t, i) =>
                t.classList.toggle('active', i === idx));
            renderEmojiGrid(idx);
            updateCatLabel(idx);
        }

        function updateCatLabel(idx) {
            document.getElementById('emoji-cat-label').textContent = EMOJI_CATEGORIES[idx].name;
        }

        function renderEmojiGrid(idx) {
            const gridEl = document.getElementById('emoji-grid');
            gridEl.innerHTML = '';
            const emojis = EMOJI_CATEGORIES[idx].emojis;
            if (!emojis.length) {
                const empty = document.createElement('div');
                empty.className = 'emoji-empty';
                empty.textContent = '🕐 Noch keine zuletzt verwendeten Emojis';
                gridEl.appendChild(empty);
                return;
            }
            emojis.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'emoji-btn';
                btn.textContent = emoji;
                btn.onclick = () => insertEmoji(emoji);
                gridEl.appendChild(btn);
            });
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('msg-input');
            const s = input.selectionStart, e = input.selectionEnd;
            input.value = input.value.slice(0, s) + emoji + input.value.slice(e);
            const pos = s + [...emoji].length;
            input.setSelectionRange(pos, pos);
            input.focus();
            autoResize(input);
            saveRecentEmoji(emoji);
        }

        function toggleEmojiPicker() {
            emojiPickerOpen = !emojiPickerOpen;
            document.getElementById('emoji-picker').classList.toggle('open', emojiPickerOpen);
            document.getElementById('emoji-toggle-btn').classList.toggle('active', emojiPickerOpen);
            if (emojiPickerOpen) {
                EMOJI_CATEGORIES[0].emojis = loadRecentEmojis();
                switchCategory(0);
            }
        }

        document.addEventListener('click', e => {
            if (!emojiPickerOpen) return;
            const picker = document.getElementById('emoji-picker');
            const btn = document.getElementById('emoji-toggle-btn');
            if (!picker.contains(e.target) && e.target !== btn && !btn.contains(e.target)) {
                emojiPickerOpen = false;
                picker.classList.remove('open');
                btn.classList.remove('active');
            }
        });

        ══════════════════════════════════════════════════════════════════ */
        async function loadContacts() {
            await waitForFirebase();
            const { collection, getDocs, where, query } = window._firebaseFns;
            const db = window._db;

            const snap = await getDocs(
                query(collection(db, 'users'), where('status', '==', 'approved'))
            );

            allUsers = [];
            snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));

            if (myRole === 'admin' && !allUsers.find(u => u.uid === 'admin')) {
                allUsers.unshift({ uid: 'admin', name: 'Kati (Admin)', email: '' });
            }

            renderContactList(allUsers);
            listenUnreadCounts();
            buildEmojiPicker();
        }

        function renderContactList(users) {
            const list = document.getElementById('contact-list');
            list.innerHTML = '';
            allContactData = [];

            list.appendChild(makeSectionLabel('Gruppen'));
            const groupItem = createContactItem({
                id: 'group_all', name: '🏠 Mentlberg-WG',
                sub: 'Alle Mitglieder', isGroup: true
            });
            list.appendChild(groupItem);
            allContactData.push({ id: 'group_all', name: 'Mentlberg-WG', el: groupItem });

            const me = myId();
            const others = users.filter(u => u.uid !== me);
            if (others.length) {
                list.appendChild(makeSectionLabel('Direktnachrichten'));
                others.forEach(user => {
                    const chatId = getPrivateChatId(me, user.uid);
                    const item = createContactItem({
                        id: chatId, name: user.name,
                        sub: '🔒 Privater Chat', isGroup: false,
                        initial: user.name.charAt(0)
                    });
                    list.appendChild(item);
                    allContactData.push({ id: chatId, name: user.name, el: item });
                });
            }
        }

        function makeSectionLabel(text) {
            const div = document.createElement('div');
            div.className = 'section-label';
            div.textContent = text;
            return div;
        }

        function createContactItem({ id, name, sub, isGroup, initial }) {
            const div = document.createElement('div');
            div.className = 'contact-item';
            div.id = 'contact-' + id;
            div.onclick = () => openChat(id, name, isGroup);
            div.innerHTML = `
            <div class="contact-avatar ${isGroup ? 'group' : ''}">
                ${isGroup ? '🏠' : (initial || '?')}
            </div>
            <div class="contact-body">
                <div class="contact-row1">
                    <span class="contact-name">${escapeHtml(name)}</span>
                    <span class="contact-time" id="time-${id}"></span>
                </div>
                <div class="contact-row2">
                    <span class="contact-preview" id="preview-${id}">${sub}</span>
                    <span class="unread-badge"   id="unread-${id}">0</span>
                </div>
            </div>`;
            return div;
        }

        function filterContacts(q) {
            const term = q.toLowerCase().trim();
            allContactData.forEach(({ name, el }) => {
                el.style.display = (!term || name.toLowerCase().includes(term)) ? '' : 'none';
            });
        }

        /* ── Unread counts ──────────────────────────────────────────────── */
        function listenUnreadCounts() {
            const { collection, query, orderBy, onSnapshot } = window._firebaseFns;
            const db = window._db;
            const me = myId();

            const chatIds = ['group_all'];
            allUsers.forEach(u => {
                if (u.uid !== me) chatIds.push(getPrivateChatId(me, u.uid));
            });

            chatIds.forEach(chatId => {
                if (unreadListeners[chatId]) return;
                const q = query(
                    collection(db, 'chats', chatId, 'messages'),
                    orderBy('createdAt', 'desc')
                );
                unreadListeners[chatId] = onSnapshot(q, snap => {
                    if (snap.empty) return;
                    const latest = snap.docs[0].data();
                    const previewEl = document.getElementById('preview-' + chatId);
                    const timeEl = document.getElementById('time-' + chatId);
                    const unreadEl = document.getElementById('unread-' + chatId);

                    if (previewEl && latest.text) {
                        const sender = latest.senderName === myName ? 'Du' : latest.senderName;
                        previewEl.textContent = sender + ': ' + latest.text;
                    }
                    if (timeEl && latest.createdAt) {
                        timeEl.textContent = formatTime(latest.createdAt.toDate());
                    }
                    if (chatId !== currentChatId && unreadEl) {
                        let count = 0;
                        snap.docs.forEach(d => {
                            const data = d.data();
                            if (data.senderUid !== me &&
                                !(data.readBy || []).includes(me)) count++;
                        });
                        unreadEl.textContent = count > 99 ? '99+' : count;
                        unreadEl.style.display = count > 0 ? 'inline-block' : 'none';
                        if (timeEl) timeEl.classList.toggle('unread-time', count > 0);
                    }
                });
            });
        }

        /* ── Open Chat ──────────────────────────────────────────────────── */
        function openChat(chatId, chatName, isGroup) {
            /* ✅ FIX: Alten Listener sauber beenden */
            if (unsubMessages) {
                unsubMessages();
                unsubMessages = null;
            }

            currentChatId = chatId;
            currentChatName = chatName;

            document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
            const item = document.getElementById('contact-' + chatId);
            if (item) item.classList.add('active');

            const unreadEl = document.getElementById('unread-' + chatId);
            if (unreadEl) unreadEl.style.display = 'none';
            const timeEl = document.getElementById('time-' + chatId);
            if (timeEl) timeEl.classList.remove('unread-time');

            const hAvatar = document.getElementById('chat-header-avatar');
            hAvatar.textContent = isGroup ? '🏠' : chatName.charAt(0).toUpperCase();
            hAvatar.className = 'chat-header-avatar' + (isGroup ? ' group' : '');
            document.getElementById('chat-header-name').textContent = chatName;
            document.getElementById('chat-header-sub').textContent =
                isGroup ? '👥 Gruppen-Chat · alle Mitglieder' : '🔒 Privater Chat';

            document.getElementById('chat-placeholder').style.display = 'none';
            document.getElementById('chat-header').classList.add('visible');
            document.getElementById('input-area').classList.add('visible');
            document.getElementById('messages-container').innerHTML =
                '<div class="spinner">⏳ Lade Nachrichten...</div>';

            emojiPickerOpen = false;
            document.getElementById('emoji-picker').classList.remove('open');
            document.getElementById('emoji-toggle-btn').classList.remove('active');

            document.getElementById('sidebar').classList.add('hidden-mobile');
            document.getElementById('chat-area').classList.add('visible-mobile');

            listenMessages(chatId);
            document.getElementById('msg-input').focus();
        }

        /* ══════════════════════════════════════════════════════════════════
           ✅ FIXED: listenMessages
        ══════════════════════════════════════════════════════════════════ */
        function listenMessages(chatId) {
            const { collection, query, orderBy, onSnapshot, doc, updateDoc } =
                window._firebaseFns;
            const db = window._db;
            const me = myId();

            /* ✅ Alten Listener nochmal sicherstellen */
            if (unsubMessages) {
                unsubMessages();
                unsubMessages = null;
            }

            const q = query(
                collection(db, 'chats', chatId, 'messages'),
                orderBy('createdAt', 'asc')
            );

            /* ✅ includeMetadataChanges: false → nur echte Server-Updates */
            unsubMessages = onSnapshot(q, { includeMetadataChanges: false }, snap => {
                const container = document.getElementById('messages-container');
                if (!container) return;

                const wasAtBottom =
                    container.scrollHeight - container.scrollTop - container.clientHeight < 80;

                container.innerHTML = '';

                if (snap.empty) {
                    container.innerHTML =
                        '<div class="spinner" style="color:#8696a0">' +
                        'Noch keine Nachrichten. Schreib etwas! 👋</div>';
                    return;
                }

                let lastDate = null;
                let lastSenderUid = null;

                snap.docs.forEach(d => {
                    const data = d.data();

                    /* ✅ FIX: Nachrichten ohne Timestamp überspringen
                       (passiert kurz nach dem Senden, bevor Server-Timestamp gesetzt ist) */
                    if (!data.createdAt) return;

                    const isOwn = data.senderUid === me;
                    const ts = data.createdAt.toDate();

                    const dateStr = ts.toLocaleDateString('de-DE',
                        { day: '2-digit', month: 'long', year: 'numeric' });
                    const todayStr = new Date().toLocaleDateString('de-DE',
                        { day: '2-digit', month: 'long', year: 'numeric' });

                    if (dateStr !== lastDate) {
                        const div = document.createElement('div');
                        div.className = 'date-divider';
                        div.innerHTML = `<span>${dateStr === todayStr ? '📅 Heute' : dateStr}</span>`;
                        container.appendChild(div);
                        lastDate = dateStr;
                        lastSenderUid = null;
                    }

                    const showAvatar = data.senderUid !== lastSenderUid;
                    lastSenderUid = data.senderUid;

                    /* ✅ Als gelesen markieren */
                    if (!isOwn) {
                        const readBy = data.readBy || [];
                        if (!readBy.includes(me)) {
                            updateDoc(doc(db, 'chats', chatId, 'messages', d.id), {
                                readBy: [...readBy, me]
                            }).catch(() => { });
                        }
                    }

                    const row = document.createElement('div');
                    row.className = 'message-row' +
                        (isOwn ? ' own' : '') +
                        (showAvatar ? ' group-start' : '');

                    const avatarEl = `
                    <div class="msg-avatar ${showAvatar && !isOwn ? '' : 'hidden'}">
                        ${data.senderName ? data.senderName.charAt(0).toUpperCase() : '?'}
                    </div>`;

                    const senderLabel = (!isOwn && showAvatar && currentChatId === 'group_all')
                        ? `<div class="msg-sender-name">${escapeHtml(data.senderName || 'Unbekannt')}</div>`
                        : '';

                    row.innerHTML = `
                    ${!isOwn ? avatarEl : ''}
                    <div class="bubble-wrap">
                        ${senderLabel}
                        <div class="message-bubble">
                            ${escapeHtml(data.text || '')}
                            <div class="msg-meta">
                                <span class="msg-time">${formatTime(ts)}</span>
                                ${isOwn ? '<span class="msg-ticks">✓✓</span>' : ''}
                            </div>
                        </div>
                    </div>
                    ${isOwn ? avatarEl : ''}`;

                    container.appendChild(row);
                });

                if (wasAtBottom || snap.docs.length <= 5) {
                    container.scrollTop = container.scrollHeight;
                }
            });
        }

        /* ── Send ───────────────────────────────────────────────────────── */
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const btn = document.getElementById('send-btn');
            btn.disabled = true;

            try {
                await waitForFirebase();
                const { collection, addDoc, serverTimestamp } = window._firebaseFns;
                const db = window._db;
                const me = myId();

                await addDoc(collection(db, 'chats', currentChatId, 'messages'), {
                    text,
                    senderUid: me,
                    senderName: myName,
                    createdAt: serverTimestamp(),
                    readBy: [me]
                });

                input.value = '';
                input.style.height = 'auto';
            } catch (e) {
                console.error('Fehler beim Senden:', e);
            }

            btn.disabled = false;
            input.focus();
        }

        /* ── Helpers ────────────────────────────────────────────────────── */
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function formatTime(date) {
            if (!date) return '';
            return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/\n/g, '<br>');
        }

        function showSidebar() {
            document.getElementById('sidebar').classList.remove('hidden-mobile');
            document.getElementById('chat-area').classList.remove('visible-mobile');
        }

        /* ══════════════════════════════════════════════════════════════════
           ✅ FIXED BOOT — kein doppelter Aufruf mehr
        ══════════════════════════════════════════════════════════════════ */
        if (window._firebaseReady) {
            loadContacts();
        } else {
            document.addEventListener('firebaseReady', loadContacts, { once: true });
        }
    </script>
</body>
</html>
