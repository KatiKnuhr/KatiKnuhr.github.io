                }

        .hdr-chip, .hdr-btn {

        /* ══ CONTENT ══ */

        .section-title {

        .stat-card {

        }

            .btn-reject:hover {

        .btn-delete {

        }

        .btn-reregister {

        }

            .btn-reregister:hover {

        .btn-perms {

        }

            }

        /* ══ PERMISSIONS DROPDOWN ══ */
        .perms-row td {
            background: #f4f0ff !important;

        .perms-panel {
            padding: 20px 24px;

            gap: 14px;

            .perms-panel h4 {

            }

        .perms-grid {
            display: flex;

        .perm-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 50px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            transition: all 0.2s;
            user-select: none;
        }

            .perm-toggle input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: #6f42c1;
                cursor: pointer;
            }

            .perm-toggle.checked {
                border-color: #6f42c1;
                background: #ede7ff;
                color: #4a2a9a;
            }

        .perms-save-btn {
            align-self: flex-start;

            border-radius: 50px;

            background: #6f42c1;
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

            .perms-save-btn:hover {
                background: #5a32a3;
            }

        /* ══ MISC ══ */
        .empty-state {

            font-size: 16px;

        .toast {
            position: fixed;

            border-radius: 12px;

            font-weight: 600;

            opacity: 0;

        }

            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }

        .loading {
            text-align: center;
            padding: 40px;
            color: #2c6e8a;

        }

        @media (max-width: 820px) {
            .main-header {
                height: auto;

        @media (max-width: 768px) {

            .owner-nav {
                justify-content: center;
                width: 100%;
                order: 3;
            }

            .header-right {
                order: 2;

        }

    <script>
        const EMAILJS_SERVICE_ID = 'service_8zqqtp2';
        const EMAILJS_TEMPLATE_ACTIVATED = 'template_o78ci8o';
        const EMAILJS_TEMPLATE_REREGISTER = 'template_o78ci8o';

        // All pages that can be toggled per user
        const ALL_PAGES = [
            { key: 'home', label: '🏠 Home', href: 'index.html' },
            { key: 'uebermich', label: '👤 Über mich', href: 'uebermich.html' },
            { key: 'hobbys', label: '🎿 Hobbys', href: 'hobbys.html' },
            { key: 'galerie', label: '🖼️ Galerie', href: 'galerie.html' },
            { key: 'mentlberg', label: '⛰️ Mentlberg', href: 'Mentlberg.html' },
        ];

        function waitForFirebase() {
            return new Promise(resolve => {
                if (window._firebaseReady) resolve();
                else document.addEventListener('firebaseReady', resolve, { once: true });
            });
        }

        // ── LOAD USERS ──────────────────────────────────────────────
        async function loadUsers() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('user-table-el').style.display = 'none';
            document.getElementById('empty-state').style.display = 'none';

            await waitForFirebase();
            const { collection, getDocs } = window._firebaseFns;
            const snapshot = await getDocs(collection(window._db, 'users'));
            const users = [];
            snapshot.forEach(d => users.push({ id: d.id, ...d.data() }));

            document.getElementById('loading').style.display = 'none';

            const pending = users.filter(u => u.status === 'pending').length;
            const approved = users.filter(u => u.status === 'approved').length;
            document.getElementById('stat-total').textContent = users.length;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-approved').textContent = approved;

            if (users.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                return;
            }

            users.sort((a, b) => {
                const order = { pending: 0, approved: 1, rejected: 2, reregister: 3 };
                return (order[a.status] || 0) - (order[b.status] || 0);
            });

            const tbody = document.getElementById('user-tbody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const date = user.createdAt?.toDate
                    ? user.createdAt.toDate().toLocaleDateString('de-DE') : '–';

                const statusLabels = {
                    pending: '<span class="status-badge status-pending">⏳ Ausstehend</span>',
                    approved: '<span class="status-badge status-approved">✅ Freigeschaltet</span>',
                    rejected: '<span class="status-badge status-rejected">❌ Abgelehnt</span>',
                    reregister: '<span class="status-badge status-reregister">🔄 Neu eingeladen</span>'
                };

                let actions = '';
                if (user.status === 'pending') {
                    actions = `
                            <button class="btn-approve" onclick="approveUser('${user.id}','${user.email}','${user.name}')">✅ Genehmigen</button>
                            <button class="btn-reject"  onclick="rejectUser('${user.id}','${user.name}')">❌ Ablehnen</button>`;
                } else if (user.status === 'approved') {
                    actions = `
                            <button class="btn-reject" onclick="rejectUser('${user.id}','${user.name}')">🚫 Sperren</button>
                            <button class="btn-delete" onclick="deleteUser('${user.id}','${user.name}')">🗑️ Löschen</button>`;
                } else if (user.status === 'reregister') {
                    actions = `
                            <button class="btn-approve" onclick="approveUser('${user.id}','${user.email}','${user.name}')">✅ Direkt freischalten</button>
                            <button class="btn-delete"  onclick="deleteUser('${user.id}','${user.name}')">🗑️ Löschen</button>`;
                } else {
                    actions = `
                            <button class="btn-approve"    onclick="approveUser('${user.id}','${user.email}','${user.name}')">♻️ Reaktivieren</button>
                            <button class="btn-reregister" onclick="allowReregister('${user.id}','${user.email}','${user.name}')">🔄 Neu einladen</button>
                            <button class="btn-delete"     onclick="deleteUser('${user.id}','${user.name}')">🗑️ Löschen</button>`;
                }

                // Always add permissions button (except for owner themselves)
                const isOwnerRow = user.email?.toLowerCase() === 'katharinakn@outlook.de';
                const permsBtn = isOwnerRow
                    ? `<span style="font-size:11px;color:#aaa;padding:6px 10px;">👑 Owner</span>`
                    : `<button class="btn-perms" onclick="togglePermsPanel('${user.id}')">🔑 Berechtigungen</button>`;

                tbody.innerHTML += `
                        <tr id="row-${user.id}">
                            <td><strong>${user.name || '–'}</strong></td>
                            <td>${user.email || '–'}</td>
                            <td>${statusLabels[user.status] || user.status}</td>
                            <td>${date}</td>
                            <td>
                                <div class="action-btns">
                                    ${actions}
                                    ${permsBtn}
                                </div>
                            </td>
                        </tr>
                        <tr class="perms-row" id="perms-${user.id}" style="display:none;">
                            <td colspan="5">
                                ${buildPermsPanel(user)}
                            </td>
                        </tr>`;
            });

            document.getElementById('user-table-el').style.display = 'table';

            // Attach checkbox listeners after DOM is built
            users.forEach(user => {
                ALL_PAGES.forEach(page => {
                    const cb = document.getElementById(`perm-${user.id}-${page.key}`);
                    if (cb) {
                        cb.addEventListener('change', () => {
                            const label = cb.closest('.perm-toggle');
                            if (label) label.classList.toggle('checked', cb.checked);
                        });
                    }
                });
            });
        }

        // ── BUILD PERMISSIONS PANEL HTML ────────────────────────────
        function buildPermsPanel(user) {
            // permissions field: object like { home: true, galerie: false, ... }
            // default: all false (hidden)
            const perms = user.permissions || {};

            const toggles = ALL_PAGES.map(page => {
                const checked = perms[page.key] === true;
                return `
                        <label class="perm-toggle ${checked ? 'checked' : ''}" for="perm-${user.id}-${page.key}">
                            <input type="checkbox"
                                   id="perm-${user.id}-${page.key}"
                                   ${checked ? 'checked' : ''} />
                            ${page.label}
                        </label>`;
            }).join('');

            return `
                    <div class="perms-panel">
                        <h4>🔑 Seitenberechtigungen für <em>${user.name || user.email}</em></h4>
                        <p style="font-size:12px;color:#888;margin-top:-8px;">
                            Aktivierte Seiten sind für diesen Benutzer im Menü sichtbar. Standard: alles verborgen.
                        </p>
                        <div class="perms-grid">
                            ${toggles}
                        </div>
                        <button class="perms-save-btn" onclick="savePermissions('${user.id}','${user.name}')">
                            💾 Speichern
                        </button>
                    </div>`;
        }

        // ── TOGGLE PERMISSIONS PANEL ─────────────────────────────────
        function togglePermsPanel(uid) {
            const row = document.getElementById(`perms-${uid}`);
            if (!row) return;
            const isOpen = row.style.display !== 'none';
            // Close all open panels first
            document.querySelectorAll('.perms-row').forEach(r => r.style.display = 'none');
            if (!isOpen) row.style.display = 'table-row';
        }

        // ── SAVE PERMISSIONS ─────────────────────────────────────────
        async function savePermissions(uid, name) {
            await waitForFirebase();
            const { doc, updateDoc } = window._firebaseFns;

            const permissions = {};
            ALL_PAGES.forEach(page => {
                const cb = document.getElementById(`perm-${uid}-${page.key}`);
                permissions[page.key] = cb ? cb.checked : false;
            });

            await updateDoc(doc(window._db, 'users', uid), { permissions });
            showToast(`🔑 Berechtigungen für ${name} gespeichert!`);
            // Close panel
            const row = document.getElementById(`perms-${uid}`);
            if (row) row.style.display = 'none';
        }

        // ── USER ACTIONS ─────────────────────────────────────────────
        async function approveUser(uid, email, name) {
            if (!confirm(`✅ "${name}" freischalten?`)) return;
            await waitForFirebase();
            const { doc, updateDoc } = window._firebaseFns;
            await updateDoc(doc(window._db, 'users', uid), { status: 'approved', reregisterAllowed: false });
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ACTIVATED, {
                    to_email: email, to_name: name,
                    login_link: 'https://katiknuhr.github.io/start.html'
                });
            } catch (e) { console.warn('E-Mail Fehler:', e); }
            showToast(`✅ ${name} wurde freigeschaltet!`);
            loadUsers();
        }

        async function rejectUser(uid, name) {
            if (!confirm(`❌ "${name}" ablehnen/sperren?`)) return;
            await waitForFirebase();
            const { doc, updateDoc } = window._firebaseFns;
            await updateDoc(doc(window._db, 'users', uid), { status: 'rejected', reregisterAllowed: false });
            showToast(`🚫 ${name} wurde gesperrt.`);
            loadUsers();
        }

        async function allowReregister(uid, email, name) {
            if (!confirm(`🔄 "${name}" darf sich erneut registrieren?`)) return;
            await waitForFirebase();
            const { doc, updateDoc } = window._firebaseFns;
            await updateDoc(doc(window._db, 'users', uid), { status: 'reregister', reregisterAllowed: true });
            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_REREGISTER, {
                    to_email: email, to_name: name,
                    login_link: 'https://katiknuhr.github.io/start.html'
                });
            } catch (e) { console.warn('E-Mail Fehler:', e); }
            showToast(`🔄 ${name} wurde zur erneuten Registrierung eingeladen!`);
            loadUsers();
        }

        async function deleteUser(uid, name) {
            if (!confirm(`🗑️ "${name}" dauerhaft löschen?`)) return;
            await waitForFirebase();
            const { doc, deleteDoc } = window._firebaseFns;
            await deleteDoc(doc(window._db, 'users', uid));
            showToast(`🗑️ ${name} wurde gelöscht.`);
            loadUsers();
        }

        // ── HELPERS ──────────────────────────────────────────────────
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }

        function goBack() {
            if (document.referrer && document.referrer !== window.location.href) history.back();
            else window.location.href = 'index.html';
        }

        function logout() {
            sessionStorage.clear();
            localStorage.clear();
            window.location.href = 'start.html';
        }

        document.addEventListener('firebaseReady', loadUsers);
        if (window._firebaseReady) loadUsers();
    </script>
</body>
</html>
