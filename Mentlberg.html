<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentlberg-WG</title>
    <link rel="icon" type="image/jpeg" href="Ice.jpeg">

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore,
            collection, addDoc, getDocs, doc,
            updateDoc, deleteDoc, setDoc, getDoc,
            serverTimestamp, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHCOxeQufkdx0sYIxTKPnAdrzcvErOrEA",
            authDomain: "katiknuhr-91ba3.firebaseapp.com",
            projectId: "katiknuhr-91ba3",
            storageBucket: "katiknuhr-91ba3.firebasestorage.app",
            messagingSenderId: "608861491092",
            appId: "1:608861491092:web:73a0deb3c58cbd75c18981"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window._db = db;
        window._firebaseFns = {
            collection, addDoc, getDocs, doc,
            updateDoc, deleteDoc, setDoc, getDoc,
            serverTimestamp, query, orderBy
        };
        window._firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Medien/Eis.jpeg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0.78));
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 18px 70px;
        }

        /* ══ HEADER ══════════════════════════════════════════════ */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title {
            color: white;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.6);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-chip {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-header {
            padding: 7px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.13);
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
        }

            .btn-header:hover {
                background: rgba(255,255,255,0.28);
            }

        /* ══ MONTH NAV ═══════════════════════════════════════════ */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 24px;
        }

            .month-nav button {
                background: rgba(255,255,255,0.15);
                border: 1px solid rgba(255,255,255,0.3);
                color: white;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                font-size: 18px;
                cursor: pointer;
                transition: background 0.2s;
            }

                .month-nav button:hover {
                    background: rgba(255,255,255,0.3);
                }

        .month-label {
            color: white;
            font-size: 22px;
            font-weight: 700;
            min-width: 210px;
            text-align: center;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
        }

        /* ══ LEGEND ══════════════════════════════════════════════ */
        .legend {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.75);
            font-size: 12px;
            font-weight: 600;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .ld-belegt {
            background: #2c6e8a;
        }

        .ld-frei {
            background: #28a745;
        }

        .ld-besuch {
            background: #fd7e14;
        }

        .ld-leer {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* ══ CALENDAR ════════════════════════════════════════════ */
        .calendar-wrap {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 26px;
            overflow-x: auto;
        }

        /* Header row: empty + 7 day-names */
        .cal-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 4px;
            min-width: 640px;
        }

            .cal-table th {
                color: rgba(255,255,255,0.55);
                font-size: 11px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                padding: 4px 2px;
                text-align: center;
            }

                /* Room-label column */
                .cal-table th.room-th,
                .cal-table td.room-label {
                    text-align: left;
                    white-space: nowrap;
                    padding-right: 10px;
                    min-width: 110px;
                }

        .room-label-inner {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .room-rename-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            transition: color 0.2s;
        }

            .room-rename-btn:hover {
                color: white;
            }

        /* Day cells */
        .cal-cell {
            width: 100%;
            min-height: 58px;
            border-radius: 10px;
            padding: 4px 5px;
            cursor: pointer;
            transition: all 0.18s;
            border: 2px solid transparent;
            vertical-align: top;
            position: relative;
        }

            .cal-cell:hover {
                filter: brightness(1.25);
                border-color: rgba(255,255,255,0.35);
            }

            .cal-cell.empty-cell {
                background: transparent !important;
                cursor: default;
                pointer-events: none;
            }

            .cal-cell.today-col {
                border-color: #a8d8ea !important;
            }

            /* Color by status */
            .cal-cell.st-leer {
                background: rgba(255,255,255,0.07);
            }

            .cal-cell.st-belegt {
                background: rgba(44,110,138,0.55);
            }

            .cal-cell.st-frei {
                background: rgba(40,167,69,0.45);
            }

            .cal-cell.st-besuch {
                background: rgba(253,126,20,0.45);
            }

        .cell-day {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.6);
            margin-bottom: 3px;
        }

        /* Only show day number in first room row */
        .day-num-row .cell-day {
            color: white;
            font-size: 12px;
        }

        .cell-note {
            font-size: 9px;
            color: rgba(255,255,255,0.85);
            font-weight: 600;
            line-height: 1.3;
            overflow: hidden;
            max-height: 28px;
            word-break: break-word;
        }

        /* today highlight on day-header */
        .today-th {
            color: #a8d8ea !important;
        }

        /* ══ MONTH OVERVIEW TABLE (below calendar) ═══════════════ */
        .overview-section {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 26px;
        }

        .overview-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
        }

        .overview-room {
            margin-bottom: 18px;
        }

        .overview-room-name {
            color: #a8d8ea;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ov-entry-card {
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            border-left: 4px solid transparent;
        }

            .ov-entry-card.type-belegt {
                border-left-color: #2c6e8a;
            }

            .ov-entry-card.type-frei {
                border-left-color: #28a745;
            }

            .ov-entry-card.type-besuch {
                border-left-color: #fd7e14;
            }

        .ov-info {
            flex: 1;
        }

        .ov-badge {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 4px;
        }

            .ov-badge.type-belegt {
                background: rgba(44,110,138,0.4);
                color: #a8d8ea;
            }

            .ov-badge.type-frei {
                background: rgba(40,167,69,0.35);
                color: #6fcf97;
            }

            .ov-badge.type-besuch {
                background: rgba(253,126,20,0.35);
                color: #ffb347;
            }

        .ov-dates {
            color: white;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .ov-note {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-bottom: 3px;
        }

        .ov-meta {
            color: rgba(255,255,255,0.38);
            font-size: 10px;
        }

        .ov-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-ov-edit {
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.25);
            background: transparent;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn-ov-edit:hover {
                background: rgba(255,255,255,0.12);
            }

        .btn-ov-del {
            padding: 5px 12px;
            border-radius: 50px;
            border: none;
            background: rgba(220,53,69,0.35);
            color: #ff8a8a;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn-ov-del:hover {
                background: rgba(220,53,69,0.65);
            }

        .no-ov-entries {
            color: rgba(255,255,255,0.35);
            font-size: 13px;
            padding: 8px 0;
        }

        /* ══ ENTRY PANEL (add / edit) ════════════════════════════ */
        .entry-panel {
            background: rgba(255,255,255,0.11);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 20px;
            padding: 26px;
            display: none;
            margin-bottom: 26px;
        }

            .entry-panel.open {
                display: block;
            }

        .panel-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

            .form-group label {
                color: rgba(255,255,255,0.7);
                font-size: 12px;
                font-weight: 600;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 10px 13px;
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,0.22);
                background: rgba(255,255,255,0.1);
                color: white;
                font-size: 13px;
                font-family: inherit;
                outline: none;
                transition: border 0.25s;
            }

                .form-group input:focus,
                .form-group select:focus,
                .form-group textarea:focus {
                    border-color: #a8d8ea;
                }

                .form-group input::placeholder,
                .form-group textarea::placeholder {
                    color: rgba(255,255,255,0.38);
                }

                .form-group select option {
                    background: #1a4a5e;
                    color: white;
                }

            .form-group textarea {
                resize: vertical;
                min-height: 72px;
            }

        .form-full {
            grid-column: 1 / -1;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-save {
            padding: 10px 26px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #2c6e8a, #a8d8ea);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }

            .btn-save:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 18px rgba(44,110,138,0.5);
            }

        .btn-cancel {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.28);
            background: transparent;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
        }

            .btn-cancel:hover {
                background: rgba(255,255,255,0.1);
            }

        /* ══ TOAST ═══════════════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #2c6e8a;
            color: white;
            padding: 13px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s;
            z-index: 999;
        }

            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }

        /* ══ MODAL (rename room) ══════════════════════════════════ */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.62);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

            .modal-bg.open {
                display: flex;
            }

        .modal {
            background: #1a3a4a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 34px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

            .modal h3 {
                color: white;
                font-size: 19px;
                margin-bottom: 16px;
            }

            .modal input {
                width: 100%;
                padding: 11px 15px;
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,0.22);
                background: rgba(255,255,255,0.1);
                color: white;
                font-size: 15px;
                outline: none;
                margin-bottom: 16px;
            }

                .modal input:focus {
                    border-color: #a8d8ea;
                }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* ══ RESPONSIVE ══════════════════════════════════════════ */
        @media (max-width: 680px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .title {
                font-size: 22px;
            }

            .cal-cell {
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

    <script>
        if (sessionStorage.getItem('kati_logged_in') !== 'true') {
            window.location.href = 'start.html';
        }
    </script>

    <div class="overlay"></div>

    <div class="content">

        <!-- HEADER -->
        <div class="page-header">
            <h1 class="title">⛰️ Mentlberg-WG</h1>
            <div class="header-right">
                <span class="user-chip" id="user-chip">👤 ...</span>
                <button class="btn-header" onclick="logout()">🔓 Abmelden</button>
            </div>
        </div>

        <!-- MONTH NAV -->
        <div class="month-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <div class="month-label" id="month-label">–</div>
            <button onclick="changeMonth(1)">›</button>
        </div>

        <!-- LEGEND -->
        <div class="legend">
            <div class="legend-item"><div class="legend-dot ld-belegt"></div> Belegt</div>
            <div class="legend-item"><div class="legend-dot ld-frei"></div> Zimmer frei</div>
            <div class="legend-item"><div class="legend-dot ld-besuch"></div> Besuch</div>
            <div class="legend-item"><div class="legend-dot ld-leer"></div> Kein Eintrag</div>
        </div>

        <!-- CALENDAR: alle 4 Zimmer auf einen Blick -->
        <div class="calendar-wrap">
            <table class="cal-table" id="cal-table">
                <thead id="cal-thead"></thead>
                <tbody id="cal-tbody"></tbody>
            </table>
        </div>

        <!-- ENTRY PANEL (add / edit) -->
        <div class="entry-panel" id="entry-panel">
            <div class="panel-title" id="panel-title">📅 Neuer Eintrag</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Zimmer</label>
                    <select id="f-room"></select>
                </div>
                <div class="form-group">
                    <label>Typ</label>
                    <select id="f-type">
                        <option value="belegt">🔴 Belegt / Besetzt</option>
                        <option value="frei">🟢 Zimmer frei</option>
                        <option value="besuch">🟠 Besuch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Von</label>
                    <input type="date" id="f-from" />
                </div>
                <div class="form-group">
                    <label>Bis</label>
                    <input type="date" id="f-to" />
                </div>
                <div class="form-group form-full">
                    <label>Notiz (z.B. wer übernachtet, wer weg ist…)</label>
                    <textarea id="f-note" placeholder="Mäx nur zu Besuch..."></textarea>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-save" onclick="saveEntry()">💾 Speichern</button>
                <button class="btn-cancel" onclick="closePanel()">✖ Abbrechen</button>
            </div>
        </div>

        <!-- MONTH OVERVIEW: alle Einträge des Monats -->
        <div class="overview-section">
            <div class="overview-title" id="overview-title">📋 Alle Einträge – Monat</div>
            <div id="overview-body"></div>
        </div>

    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- MODAL: Zimmer umbenennen -->
    <div class="modal-bg" id="modal-bg">
        <div class="modal">
            <h3>✏️ Zimmer umbenennen</h3>
            <input type="text" id="modal-input" placeholder="Neuer Name" maxlength="30" />
            <div class="modal-btns">
                <button class="btn-save" onclick="saveRoomName()">💾 Speichern</button>
                <button class="btn-cancel" onclick="closeModal()">✖ Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        // ══ STATE ════════════════════════════════════════════════
        const currentUser = sessionStorage.getItem('kati_name') || 'Unbekannt';
        document.getElementById('user-chip').textContent = '👤 ' + currentUser;

        const DEFAULT_ROOMS = ['Zimmer 1', 'Zimmer 2', 'Zimmer 3', 'Zimmer 4'];
        let rooms = [...DEFAULT_ROOMS];
        let currentDate = new Date();
        let allEntries = [];
        let editingEntryId = null;
        let editingRoomIndex = null;

        // ══ FIREBASE ═════════════════════════════════════════════
        function waitForFirebase() {
            return new Promise(r => {
                if (window._firebaseReady) r();
                else document.addEventListener('firebaseReady', r, { once: true });
            });
        }

        // ══ INIT ═════════════════════════════════════════════════
        async function init() {
            await waitForFirebase();
            await loadRoomNames();
            populateRoomSelect();
            renderCalendar();
            await loadEntries();
        }

        // ══ ROOM NAMES ═══════════════════════════════════════════
        async function loadRoomNames() {
            const { doc, getDoc } = window._firebaseFns;
            const snap = await getDoc(doc(window._db, 'settings', 'rooms'));
            if (snap.exists()) {
                const d = snap.data();
                rooms = [d.room0 || DEFAULT_ROOMS[0], d.room1 || DEFAULT_ROOMS[1],
                d.room2 || DEFAULT_ROOMS[2], d.room3 || DEFAULT_ROOMS[3]];
            }
        }

        function populateRoomSelect() {
            const sel = document.getElementById('f-room');
            sel.innerHTML = '';
            rooms.forEach((name, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = name;
                sel.appendChild(opt);
            });
        }

        function openRenameModal(index) {
            editingRoomIndex = index;
            document.getElementById('modal-input').value = rooms[index];
            document.getElementById('modal-bg').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-bg').classList.remove('open');
        }

        async function saveRoomName() {
            const newName = document.getElementById('modal-input').value.trim();
            if (!newName) return;
            rooms[editingRoomIndex] = newName;
            const { doc, setDoc } = window._firebaseFns;
            await setDoc(doc(window._db, 'settings', 'rooms'), {
                room0: rooms[0], room1: rooms[1],
                room2: rooms[2], room3: rooms[3]
            });
            closeModal();
            populateRoomSelect();
            renderCalendar();
            renderOverview();
            showToast(`✅ Umbenannt zu "${newName}"`);
        }

        // ══ MONTH NAV ════════════════════════════════════════════
        function changeMonth(dir) {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
            closePanel();
            renderCalendar();
            renderOverview();
        }

        // ══ CALENDAR (Alle Zimmer × alle Tage) ═══════════════════
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
            document.getElementById('month-label').textContent = `${MONTH_NAMES[month]} ${year}`;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const todayD = today.getDate();
            const isThisMonth = (today.getMonth() === month && today.getFullYear() === year);

            // ── THEAD: room-label col + day cols ──────────────────
            const thead = document.getElementById('cal-thead');
            thead.innerHTML = '';
            const headRow = document.createElement('tr');

            // Empty top-left cell
            const thEmpty = document.createElement('th');
            thEmpty.className = 'room-th';
            thEmpty.textContent = '';
            headRow.appendChild(thEmpty);

            for (let d = 1; d <= daysInMonth; d++) {
                const th = document.createElement('th');
                th.textContent = d;
                if (isThisMonth && d === todayD) th.classList.add('today-th');
                headRow.appendChild(th);
            }
            thead.appendChild(headRow);

            // ── TBODY: one row per room ───────────────────────────
            const tbody = document.getElementById('cal-tbody');
            tbody.innerHTML = '';

            rooms.forEach((roomName, rIdx) => {
                const tr = document.createElement('tr');

                // Room label cell
                const tdLabel = document.createElement('td');
                tdLabel.className = 'room-label';
                tdLabel.innerHTML = `
                        <div class="room-label-inner">
                            🚪 ${roomName}
                            <button class="room-rename-btn" onclick="openRenameModal(${rIdx})" title="Umbenennen">✏️</button>
                        </div>`;
                tr.appendChild(tdLabel);

                // Day cells
                for (let d = 1; d <= daysInMonth; d++) {
                    const td = document.createElement('td');
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const entry = getEntryForRoomDay(rIdx, d, month, year);

                    const status = entry ? entry.type : 'leer';
                    td.className = `cal-cell st-${status}`;
                    if (isThisMonth && d === todayD) td.classList.add('today-col');

                    let noteText = '';
                    if (entry && entry.note) {
                        noteText = entry.note.length > 14
                            ? entry.note.substring(0, 13) + '…'
                            : entry.note;
                    }

                    td.innerHTML = `<div class="cell-note">${noteText}</div>`;
                    td.title = entry
                        ? `${typeLabel(entry.type)}${entry.note ? ' · ' + entry.note : ''}\n✏️ ${entry.lastEditedBy || ''}${entry.lastEditedAt?.toDate ? ' · ' + entry.lastEditedAt.toDate().toLocaleString('de-DE') : ''}`
                        : `${roomName} – ${d}. ${MONTH_NAMES[month]}: kein Eintrag`;

                    td.addEventListener('click', () => openPanel(rIdx, dateStr));
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            });
        }

        // Returns the FIRST entry that covers this room+day
        function getEntryForRoomDay(roomIdx, day, month, year) {
            const date = new Date(year, month, day);
            return allEntries.find(e => {
                if (e.roomIndex !== roomIdx) return false;
                return date >= new Date(e.from) && date <= new Date(e.to);
            }) || null;
        }

        // ══ PANEL (add / edit) ════════════════════════════════════
        function openPanel(roomIdx, dateStr) {
            editingEntryId = null;
            document.getElementById('f-room').value = roomIdx;
            document.getElementById('f-from').value = dateStr;
            document.getElementById('f-to').value = dateStr;
            document.getElementById('f-type').value = 'belegt';
            document.getElementById('f-note').value = '';
            document.getElementById('panel-title').textContent =
                `📅 Neuer Eintrag – ${rooms[roomIdx]} – ${formatDate(dateStr)}`;
            document.getElementById('entry-panel').classList.add('open');
            document.getElementById('entry-panel')
                .scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function openEditPanel(entryId) {
            const e = allEntries.find(x => x.id === entryId);
            if (!e) return;
            editingEntryId = entryId;
            document.getElementById('f-room').value = e.roomIndex;
            document.getElementById('f-from').value = e.from;
            document.getElementById('f-to').value = e.to;
            document.getElementById('f-type').value = e.type;
            document.getElementById('f-note').value = e.note || '';
            document.getElementById('panel-title').textContent =
                `✏️ Eintrag bearbeiten – ${rooms[e.roomIndex]}`;
            document.getElementById('entry-panel').classList.add('open');
            document.getElementById('entry-panel')
                .scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closePanel() {
            document.getElementById('entry-panel').classList.remove('open');
            editingEntryId = null;
        }

        // ══ SAVE / DELETE ═════════════════════════════════════════
        async function saveEntry() {
            const roomIdx = parseInt(document.getElementById('f-room').value);
            const from = document.getElementById('f-from').value;
            const to = document.getElementById('f-to').value;
            const type = document.getElementById('f-type').value;
            const note = document.getElementById('f-note').value.trim();

            if (!from || !to) { showToast('⚠️ Bitte Von- und Bis-Datum ausfüllen!'); return; }
            if (from > to) { showToast('⚠️ Startdatum muss vor Enddatum liegen!'); return; }

            const { collection, addDoc, doc, updateDoc, serverTimestamp } = window._firebaseFns;
            const payload = {
                roomIndex: roomIdx,
                roomName: rooms[roomIdx],
                from, to, type, note,
                lastEditedBy: currentUser,
                lastEditedAt: serverTimestamp()
            };

            if (editingEntryId) {
                await updateDoc(doc(window._db, 'calendar_entries', editingEntryId), payload);
                showToast('✅ Eintrag aktualisiert!');
            } else {
                await addDoc(collection(window._db, 'calendar_entries'), payload);
                showToast('✅ Eintrag gespeichert!');
            }

            editingEntryId = null;
            closePanel();
            await loadEntries();
        }

        async function deleteEntry(id) {
            if (!confirm('🗑️ Eintrag wirklich löschen?')) return;
            const { doc, deleteDoc } = window._firebaseFns;
            await deleteDoc(doc(window._db, 'calendar_entries', id));
            showToast('🗑️ Eintrag gelöscht.');
            await loadEntries();
        }

        // ══ LOAD ══════════════════════════════════════════════════
        async function loadEntries() {
            const { collection, getDocs, query, orderBy } = window._firebaseFns;
            const q = query(collection(window._db, 'calendar_entries'), orderBy('from'));
            const snap = await getDocs(q);
            allEntries = [];
            snap.forEach(d => allEntries.push({ id: d.id, ...d.data() }));
            renderCalendar();
            renderOverview();
        }

        // ══ OVERVIEW (Monatsliste alle Zimmer) ════════════════════
        function renderOverview() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni',
                'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

            document.getElementById('overview-title').textContent =
                `📋 Alle Einträge – ${MONTH_NAMES[month]} ${year}`;

            const body = document.getElementById('overview-body');
            body.innerHTML = '';

            let anyEntry = false;

            rooms.forEach((roomName, rIdx) => {
                const roomEntries = allEntries.filter(e => {
                    if (e.roomIndex !== rIdx) return false;
                    const mStart = new Date(year, month, 1);
                    const mEnd = new Date(year, month + 1, 0);
                    return new Date(e.from) <= mEnd && new Date(e.to) >= mStart;
                });

                const section = document.createElement('div');
                section.className = 'overview-room';
                section.innerHTML = `<div class="overview-room-name">🚪 ${roomName}</div>`;

                if (roomEntries.length === 0) {
                    section.innerHTML += `<div class="no-ov-entries">Keine Einträge diesen Monat.</div>`;
                } else {
                    anyEntry = true;
                    roomEntries.forEach(entry => {
                        const sameDay = entry.from === entry.to;
                        const dateStr = sameDay
                            ? formatDate(entry.from)
                            : `${formatDate(entry.from)} → ${formatDate(entry.to)}`;

                        let metaStr = '';
                        if (entry.lastEditedBy) {
                            const ts = entry.lastEditedAt?.toDate ? entry.lastEditedAt.toDate() : null;
                            metaStr = `✏️ ${entry.lastEditedBy}${ts ? ' · ' + ts.toLocaleString('de-DE') : ''}`;
                        }

                        const card = document.createElement('div');
                        card.className = `ov-entry-card type-${entry.type}`;
                        card.innerHTML = `
                                <div class="ov-info">
                                    <div class="ov-badge type-${entry.type}">${typeLabel(entry.type)}</div>
                                    <div class="ov-dates">${dateStr}</div>
                                    ${entry.note ? `<div class="ov-note">📝 ${entry.note}</div>` : ''}
                                    <div class="ov-meta">${metaStr}</div>
                                </div>
                                <div class="ov-actions">
                                    <button class="btn-ov-edit" onclick="openEditPanel('${entry.id}')">✏️ Bearbeiten</button>
                                    <button class="btn-ov-del"  onclick="deleteEntry('${entry.id}')">🗑️</button>
                                </div>`;
                        section.appendChild(card);
                    });
                }

                body.appendChild(section);
            });
        }

        // ══ HELPERS ═══════════════════════════════════════════════
        function typeLabel(t) {
            return { belegt: '🔴 Belegt', frei: '🟢 Frei', besuch: '🟠 Besuch' }[t] || t;
        }

        function formatDate(str) {
            if (!str) return '–';
            const [y, m, d] = str.split('-');
            return `${d}.${m}.${y}`;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'start.html';
        }

        // ══ START ═════════════════════════════════════════════════
        document.addEventListener('firebaseReady', init);
        if (window._firebaseReady) init();
    </script>

</body>
