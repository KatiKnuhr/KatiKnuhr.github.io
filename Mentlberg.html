<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentlberg-WG</title>
    <link rel="icon" type="image/jpeg" href="Ice.jpeg">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getFirestore,
            collection, addDoc, getDocs, doc,
            updateDoc, deleteDoc, setDoc, getDoc,
            serverTimestamp, query, orderBy
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHCOxeQufkdx0sYIxTKPnAdrzcvErOrEA",
            authDomain: "katiknuhr-91ba3.firebaseapp.com",
            projectId: "katiknuhr-91ba3",
            storageBucket: "katiknuhr-91ba3.firebasestorage.app",
            messagingSenderId: "608861491092",
            appId: "1:608861491092:web:73a0deb3c58cbd75c18981"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window._db = db;
        window._firebaseFns = {
            collection, addDoc, getDocs, doc,
            updateDoc, deleteDoc, setDoc, getDoc,
            serverTimestamp, query, orderBy
        };
        window._firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Medien/Eis.jpeg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.52), rgba(0,0,0,0.82));
            z-index: 0;
        }

        /* ══════════════════════════════════════════
           SHARED MAIN-HEADER
        ══════════════════════════════════════════ */
        .main-header {
            position: relative;
            z-index: 10;
            background: rgba(18, 52, 70, 0.97);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(168,216,234,0.18);
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-title {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1.5px;
            white-space: nowrap;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        .owner-nav {
            display: none;
            list-style: none;
            align-items: center;
            gap: 4px;
            flex: 1;
            justify-content: center;
            flex-wrap: wrap;
        }

            .owner-nav.visible {
                display: flex;
            }

            .owner-nav a {
                color: rgba(255,255,255,0.68);
                text-decoration: none;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 1px;
                text-transform: uppercase;
                padding: 7px 15px;
                border-radius: 50px;
                border: 1px solid rgba(255,255,255,0.14);
                background: rgba(255,255,255,0.07);
                transition: background 0.22s, color 0.22s, border-color 0.22s;
                white-space: nowrap;
                display: flex;
                align-items: center;
                gap: 5px;
            }

                .owner-nav a:hover {
                    background: rgba(168,216,234,0.18);
                    border-color: rgba(168,216,234,0.35);
                    color: #a8d8ea;
                }

                .owner-nav a.active {
                    background: rgba(168,216,234,0.25);
                    border-color: rgba(168,216,234,0.55);
                    color: #a8d8ea;
                }

        .header-right {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
        }

        .hdr-chip, .hdr-btn {
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
            cursor: pointer;
            transition: background .22s, border-color .22s;
            text-decoration: none;
        }

        /* User-Chip – klickbar für Admin */
        .hdr-chip {
            background: rgba(168,216,234,0.12);
            border: 1px solid rgba(168,216,234,0.28);
            color: rgba(255,255,255,0.88);
            cursor: default;
        }

            .hdr-chip.admin-clickable {
                cursor: pointer;
                border-color: rgba(168,216,234,0.55);
                background: rgba(168,216,234,0.20);
            }

                .hdr-chip.admin-clickable:hover {
                    background: rgba(168,216,234,0.35);
                    border-color: rgba(168,216,234,0.75);
                    color: #fff;
                }

        .hdr-btn {
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.85);
            position: relative;
        }

            .hdr-btn:hover {
                background: rgba(255,255,255,0.20);
            }

            .hdr-btn.chat {
                background: rgba(168,216,234,0.14);
                border-color: rgba(168,216,234,0.38);
                color: #a8d8ea;
            }

                .hdr-btn.chat:hover {
                    background: rgba(168,216,234,0.28);
                }

        .chat-dot {
            position: absolute;
            top: 3px;
            right: 4px;
            width: 7px;
            height: 7px;
            background: #ff4d4d;
            border-radius: 50%;
            display: none;
        }

        /* ══════════════════════════════════════════
           CONTENT
        ══════════════════════════════════════════ */
        .content {
            position: relative;
            z-index: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 16px 80px;
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 22px;
        }

            .month-nav button {
                background: rgba(255,255,255,0.13);
                border: 1px solid rgba(255,255,255,0.28);
                color: #fff;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                font-size: 20px;
                cursor: pointer;
                transition: background .2s;
            }

                .month-nav button:hover {
                    background: rgba(255,255,255,0.28);
                }

        .month-label {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            min-width: 220px;
            text-align: center;
            text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255,255,255,0.82);
            font-size: 13px;
            font-weight: 600;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
        }

        .ld-belegt {
            background: #c0392b;
        }

        .ld-frei {
            background: #27ae60;
        }

        .ld-besuch {
            background: #e67e22;
        }

        .ld-leer {
            background: rgba(255,255,255,0.13);
            border: 1px solid rgba(255,255,255,0.28);
        }

        .calendar-wrap {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 22px;
            padding: 18px 14px;
            margin-bottom: 26px;
            overflow-x: auto;
        }

        .cal-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            min-width: 480px;
        }

            .cal-table thead th {
                padding: 10px 6px 14px;
                text-align: center;
                vertical-align: middle;
                border-bottom: 2px solid rgba(255,255,255,0.14);
            }

        .th-day-label {
            width: 56px;
            min-width: 56px;
            color: rgba(255,255,255,0.45);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            padding-left: 4px;
        }

        .room-head-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .room-head-name {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
        }

        .room-rename-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.45);
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            transition: color .2s;
            line-height: 1;
            flex-shrink: 0;
        }

            .room-rename-btn:hover {
                color: #fff;
            }

        .cal-table tbody tr {
            transition: background .15s;
        }

            .cal-table tbody tr:hover {
                background: rgba(255,255,255,0.04);
            }

        .td-day {
            padding: 2px 8px 2px 4px;
            text-align: right;
            vertical-align: middle;
            white-space: nowrap;
            user-select: none;
        }

        .day-num {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            min-width: 20px;
            display: inline-block;
            text-align: right;
        }

        .day-wd {
            font-size: 10px;
            color: rgba(255,255,255,0.32);
            margin-left: 3px;
        }

        .today-row .day-num {
            color: #a8d8ea;
            font-size: 13px;
        }

        .today-row .day-wd {
            color: #a8d8ea;
        }

        .cal-cell {
            padding: 2px 3px;
            vertical-align: top;
            cursor: pointer;
        }

        .cell-inner {
            border-radius: 8px;
            min-height: 36px;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 5px 7px;
            transition: filter .18s, border-color .18s;
            border: 2px solid transparent;
            position: relative;
            box-sizing: border-box;
        }

        .cal-cell:hover .cell-inner {
            filter: brightness(1.3);
            border-color: rgba(255,255,255,0.4);
        }

        .cell-inner.st-leer {
            background: rgba(255,255,255,0.07);
        }

        .cell-inner.st-belegt {
            background: rgba(192,57,43,0.60);
        }

        .cell-inner.st-frei {
            background: rgba(39,174,96,0.55);
        }

        .cell-inner.st-besuch {
            background: rgba(230,126,34,0.60);
        }

        .today-row .cell-inner {
            border-color: rgba(168,216,234,0.55) !important;
        }

        .cell-note {
            font-size: 11px;
            color: rgba(255,255,255,0.95);
            font-weight: 600;
            line-height: 1.35;
            word-break: break-word;
            width: 100%;
            overflow: hidden;
        }

        .week-sep td {
            border-top: 1px solid rgba(255,255,255,0.09) !important;
        }

        .overview-section {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 22px;
            padding: 24px;
            margin-bottom: 26px;
        }

        .overview-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255,255,255,0.13);
        }

        .overview-room {
            margin-bottom: 20px;
        }

        .overview-room-name {
            color: #a8d8ea;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .ov-entry-card {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            border-left: 4px solid transparent;
        }

            .ov-entry-card.type-belegt {
                border-left-color: #c0392b;
            }

            .ov-entry-card.type-frei {
                border-left-color: #27ae60;
            }

            .ov-entry-card.type-besuch {
                border-left-color: #e67e22;
            }

        .ov-info {
            flex: 1;
        }

        .ov-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 5px;
        }

            .ov-badge.type-belegt {
                background: rgba(192,57,43,0.35);
                color: #ff8a8a;
            }

            .ov-badge.type-frei {
                background: rgba(39,174,96,0.30);
                color: #6fcf97;
            }

            .ov-badge.type-besuch {
                background: rgba(230,126,34,0.30);
                color: #ffb347;
            }

        .ov-dates {
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .ov-note {
            color: rgba(255,255,255,0.62);
            font-size: 12px;
            margin-bottom: 3px;
        }

        .ov-meta {
            color: rgba(255,255,255,0.35);
            font-size: 10px;
        }

        .ov-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-ov-edit {
            padding: 5px 13px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.24);
            background: transparent;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            font-family: inherit;
        }

            .btn-ov-edit:hover {
                background: rgba(255,255,255,0.12);
            }

        .btn-ov-del {
            padding: 5px 13px;
            border-radius: 50px;
            border: none;
            background: rgba(192,57,43,0.35);
            color: #ff8a8a;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
            font-family: inherit;
        }

            .btn-ov-del:hover {
                background: rgba(192,57,43,0.65);
            }

        .no-ov-entries {
            color: rgba(255,255,255,0.32);
            font-size: 13px;
            padding: 6px 0;
        }

        .entry-panel {
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 22px;
            padding: 26px;
            display: none;
            margin-bottom: 26px;
        }

            .entry-panel.open {
                display: block;
            }

        .panel-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

            .form-group label {
                color: rgba(255,255,255,0.68);
                font-size: 12px;
                font-weight: 600;
            }

            .form-group input,
            .form-group select,
            .form-group textarea {
                padding: 10px 13px;
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,0.20);
                background: rgba(255,255,255,0.09);
                color: #fff;
                font-size: 13px;
                font-family: inherit;
                outline: none;
                transition: border .22s;
            }

                .form-group input:focus,
                .form-group select:focus,
                .form-group textarea:focus {
                    border-color: #a8d8ea;
                }

                .form-group input::placeholder,
                .form-group textarea::placeholder {
                    color: rgba(255,255,255,0.35);
                }

                .form-group select option {
                    background: #1a3a4a;
                    color: #fff;
                }

            .form-group textarea {
                resize: vertical;
                min-height: 72px;
            }

        .form-full {
            grid-column: 1 / -1;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-save {
            padding: 10px 26px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all .22s;
            font-family: inherit;
        }

            .btn-save:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 18px rgba(192,57,43,0.5);
            }

        .btn-cancel {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.26);
            background: transparent;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .22s;
            font-family: inherit;
        }

            .btn-cancel:hover {
                background: rgba(255,255,255,0.10);
            }

        .toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #27ae60;
            color: #fff;
            padding: 13px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all .4s;
            z-index: 999;
        }

            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

            .modal-bg.open {
                display: flex;
            }

        .modal {
            background: #1a3040;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 20px;
            padding: 34px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

            .modal h3 {
                color: #fff;
                font-size: 19px;
                margin-bottom: 16px;
            }

            .modal input {
                width: 100%;
                padding: 11px 15px;
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,0.20);
                background: rgba(255,255,255,0.09);
                color: #fff;
                font-size: 15px;
                outline: none;
                margin-bottom: 16px;
                font-family: inherit;
            }

                .modal input:focus {
                    border-color: #a8d8ea;
                }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        @media (max-width: 820px) {
            .main-header {
                height: auto;
                padding: 10px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }

            .header-title {
                font-size: 17px;
            }

            .owner-nav a {
                font-size: 10px;
                padding: 5px 10px;
                letter-spacing: 0.5px;
            }

            .hdr-chip, .hdr-btn {
                font-size: 11px;
                padding: 5px 11px;
            }
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .cell-inner {
                min-height: 30px;
            }

            .room-head-name {
                font-size: 12px;
            }

            .owner-nav {
                justify-content: center;
                width: 100%;
                order: 3;
            }

            .header-right {
                order: 2;
            }
        }
    </style>
</head>
<body>

    <script>
        if (sessionStorage.getItem('kati_logged_in') !== 'true') {
            window.location.href = 'start.html';
        }
    </script>

    <div class="overlay"></div>

    <header class="main-header">
        <span class="header-title">⛰️ Mentlberg-WG</span>

        <ul class="owner-nav" id="owner-nav">
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="uebermich.html">👤 Über mich</a></li>
            <li><a href="hobbys.html">🎿 Hobbys</a></li>
            <li><a href="galerie.html">🖼️ Galerie</a></li>
            <li><a href="Mentlberg.html" class="active">⛰️ Mentlberg</a></li>
        </ul>

        <div class="header-right">
            <span class="hdr-chip" id="user-chip">👤 ...</span>
            <a href="chat.html" class="hdr-btn chat">
                💬 Chat
                <span class="chat-dot" id="chat-dot"></span>
            </a>
            <button class="hdr-btn" onclick="logout()">🔓 Abmelden</button>
        </div>
    </header>

    <div class="content">
        <div class="month-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <div class="month-label" id="month-label">–</div>
            <button onclick="changeMonth(1)">›</button>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="legend-dot ld-belegt"></div> Belegt</div>
            <div class="legend-item"><div class="legend-dot ld-frei"></div> Zimmer frei</div>
            <div class="legend-item"><div class="legend-dot ld-besuch"></div> Besuch</div>
            <div class="legend-item"><div class="legend-dot ld-leer"></div> Kein Eintrag</div>
        </div>

        <div class="calendar-wrap">
            <table class="cal-table" id="cal-table">
                <thead id="cal-thead"></thead>
                <tbody id="cal-tbody"></tbody>
            </table>
        </div>

        <div class="entry-panel" id="entry-panel">
            <div class="panel-title" id="panel-title">📅 Neuer Eintrag</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Zimmer</label>
                    <select id="f-room"></select>
                </div>
                <div class="form-group">
                    <label>Typ</label>
                    <select id="f-type">
                        <option value="belegt">🔴 Belegt / Besetzt</option>
                        <option value="frei">🟢 Zimmer frei</option>
                        <option value="besuch">🟠 Besuch</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Von</label>
                    <input type="date" id="f-from" />
                </div>
                <div class="form-group">
                    <label>Bis</label>
                    <input type="date" id="f-to" />
                </div>
                <div class="form-group form-full">
                    <label>Notiz (z.B. wer übernachtet, wer weg ist…)</label>
                    <textarea id="f-note" placeholder="z.B. Max nur zu Besuch..."></textarea>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-save" onclick="saveEntry()">💾 Speichern</button>
                <button class="btn-cancel" onclick="closePanel()">✖ Abbrechen</button>
            </div>
        </div>

        <div class="overview-section">
            <div class="overview-title" id="overview-title">📋 Alle Einträge – Monat</div>
            <div id="overview-body"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-bg" id="modal-bg">
        <div class="modal">
            <h3>✏️ Zimmer umbenennen</h3>
            <input type="text" id="modal-input" placeholder="Neuer Name" maxlength="30" />
            <div class="modal-btns">
                <button class="btn-save" onclick="saveRoomName()">💾 Speichern</button>
                <button class="btn-cancel" onclick="closeModal()">✖ Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        const OWNER_EMAIL = 'katharinakn@outlook.de';

        const currentUser = sessionStorage.getItem('kati_name') || 'Unbekannt';
        const currentEmail = sessionStorage.getItem('kati_email') || localStorage.getItem('kati_email') || '';
        const currentRole = sessionStorage.getItem('kati_role') || localStorage.getItem('kati_role') || '';

        const isOwner = (
            currentEmail.toLowerCase() === OWNER_EMAIL.toLowerCase() ||
            currentRole === 'admin'
        );

        // User-Chip
        const chip = document.getElementById('user-chip');
        chip.textContent = '👤 ' + currentUser;
        if (isOwner) {
            chip.classList.add('admin-clickable');
            chip.title = '🛡️ Admin-Panel öffnen';
            chip.style.cursor = 'pointer';
            chip.addEventListener('click', () => {
                window.location.href = 'admin.html';
            });
        }

        // Owner-Nav
        if (isOwner) {
            document.getElementById('owner-nav').classList.add('visible');
        }

        // ── STATE ──
        const DEFAULT_ROOMS = ['Zimmer 1', 'Zimmer 2', 'Zimmer 3', 'Zimmer 4'];
        let rooms = [...DEFAULT_ROOMS];
        let currentDate = new Date();
        let allEntries = [];
        let editingEntryId = null;
        let editingRoomIdx = null;

        const MONTH_NAMES = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
        const WD_SHORT = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

        function waitForFirebase() {
            return new Promise(r => {
                if (window._firebaseReady) r();
                else document.addEventListener('firebaseReady', r, { once: true });
            });
        }

        async function init() {
            await waitForFirebase();
            await loadRoomNames();
            populateRoomSelect();
            renderCalendar();
            await loadEntries();
            checkUnreadMessages();
        }

        async function checkUnreadMessages() {
            try {
                const { collection, getDocs } = window._firebaseFns;
                const myRole = sessionStorage.getItem('kati_role') || localStorage.getItem('kati_role');
                const myId = myRole === 'admin'
                    ? 'admin'
                    : (sessionStorage.getItem('kati_uid') || localStorage.getItem('kati_uid') || 'admin');

                const chatIds = ['group_all'];
                const usersSnap = await getDocs(collection(window._db, 'users'));
                usersSnap.forEach(d => {
                    const data = d.data();
                    if (data.status === 'approved' && d.id !== myId) {
                        chatIds.push([myId, d.id].sort().join('__'));
                    }
                });

                let totalUnread = 0;
                for (const chatId of chatIds) {
                    const snap = await getDocs(collection(window._db, 'chats', chatId, 'messages'));
                    snap.forEach(d => {
                        const data = d.data();
                        if (data.senderUid !== myId) {
                            const readBy = data.readBy || [];
                            if (!readBy.includes(myId)) totalUnread++;
                        }
                    });
                }
                if (totalUnread > 0) document.getElementById('chat-dot').style.display = 'block';
            } catch (e) { }
        }

        async function loadRoomNames() {
            const { doc, getDoc } = window._firebaseFns;
            const snap = await getDoc(doc(window._db, 'settings', 'rooms'));
            if (snap.exists()) {
                const d = snap.data();
                rooms = [d.room0 || DEFAULT_ROOMS[0], d.room1 || DEFAULT_ROOMS[1], d.room2 || DEFAULT_ROOMS[2], d.room3 || DEFAULT_ROOMS[3]];
            }
        }

        function populateRoomSelect() {
            const sel = document.getElementById('f-room');
            sel.innerHTML = '';
            rooms.forEach((name, i) => {
                const opt = document.createElement('option');
                opt.value = i; opt.textContent = name;
                sel.appendChild(opt);
            });
        }

        function openRenameModal(index) {
            editingRoomIdx = index;
            document.getElementById('modal-input').value = rooms[index];
            document.getElementById('modal-bg').classList.add('open');
        }
        function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

        async function saveRoomName() {
            const newName = document.getElementById('modal-input').value.trim();
            if (!newName) return;
            rooms[editingRoomIdx] = newName;
            const { doc, setDoc } = window._firebaseFns;
            await setDoc(doc(window._db, 'settings', 'rooms'), {
                room0: rooms[0], room1: rooms[1], room2: rooms[2], room3: rooms[3]
            });
            closeModal();
            populateRoomSelect();
            renderCalendar();
            renderOverview();
            showToast(`✅ Umbenannt zu „${newName}"`);
        }

        function changeMonth(dir) {
            currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
            closePanel();
            renderCalendar();
            renderOverview();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('month-label').textContent = `${MONTH_NAMES[month]} ${year}`;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const isThisMonth = today.getMonth() === month && today.getFullYear() === year;

            const thead = document.getElementById('cal-thead');
            thead.innerHTML = '';
            const headRow = document.createElement('tr');
            const thEmpty = document.createElement('th');
            thEmpty.className = 'th-day-label';
            thEmpty.textContent = 'Tag';
            headRow.appendChild(thEmpty);

            rooms.forEach((name, rIdx) => {
                const th = document.createElement('th');
                th.innerHTML = `
                        <div class="room-head-inner">
                            <span class="room-head-name">🚪 ${name}</span>
                            <button class="room-rename-btn" onclick="openRenameModal(${rIdx})" title="Umbenennen">✏️</button>
                        </div>`;
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);

            const tbody = document.getElementById('cal-tbody');
            tbody.innerHTML = '';

            for (let d = 1; d <= 31; d++) {
                const tr = document.createElement('tr');
                const isValid = d <= daysInMonth;
                const isToday = isThisMonth && isValid && d === today.getDate();

                if (isToday) tr.classList.add('today-row');
                if (d % 7 === 1 && d > 1) tr.classList.add('week-sep');

                const tdDay = document.createElement('td');
                tdDay.className = 'td-day';
                if (isValid) {
                    const wd = new Date(year, month, d).getDay();
                    tdDay.innerHTML = `<span class="day-num">${d}</span><span class="day-wd">${WD_SHORT[wd]}</span>`;
                } else {
                    tdDay.innerHTML = `<span class="day-num" style="opacity:.15">${d}</span>`;
                }
                tr.appendChild(tdDay);

                rooms.forEach((roomName, rIdx) => {
                    const td = document.createElement('td');
                    td.className = 'cal-cell';

                    if (!isValid) {
                        td.innerHTML = `<div class="cell-inner" style="opacity:.08;cursor:default;"></div>`;
                        tr.appendChild(td);
                        return;
                    }

                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const entry = getEntryForRoomDay(rIdx, d, month, year);
                    const status = entry ? entry.type : 'leer';
                    const note = entry?.note || '';

                    td.innerHTML = `<div class="cell-inner st-${status}"><div class="cell-note">${note}</div></div>`;
                    td.title = entry
                        ? `${typeLabel(entry.type)}${entry.note ? ' · ' + entry.note : ''}\n✏️ ${entry.lastEditedBy || ''}` +
                        (entry.lastEditedAt?.toDate ? ' · ' + entry.lastEditedAt.toDate().toLocaleString('de-DE') : '')
                        : `${roomName} – ${d}. ${MONTH_NAMES[month]}: kein Eintrag`;

                    td.addEventListener('click', () => openPanel(rIdx, dateStr));
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }
        }

        function getEntryForRoomDay(roomIdx, day, month, year) {
            const date = new Date(year, month, day);
            return allEntries.find(e => {
                if (e.roomIndex !== roomIdx) return false;
                return date >= new Date(e.from) && date <= new Date(e.to);
            }) || null;
        }

        function openPanel(roomIdx, dateStr) {
            editingEntryId = null;
            document.getElementById('f-room').value = roomIdx;
            document.getElementById('f-from').value = dateStr;
            document.getElementById('f-to').value = dateStr;
            document.getElementById('f-type').value = 'belegt';
            document.getElementById('f-note').value = '';
            document.getElementById('panel-title').textContent =
                `📅 Neuer Eintrag – ${rooms[roomIdx]} – ${formatDate(dateStr)}`;
            document.getElementById('entry-panel').classList.add('open');
            document.getElementById('entry-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function openEditPanel(entryId) {
            const e = allEntries.find(x => x.id === entryId);
            if (!e) return;
            editingEntryId = entryId;
            document.getElementById('f-room').value = e.roomIndex;
            document.getElementById('f-from').value = e.from;
            document.getElementById('f-to').value = e.to;
            document.getElementById('f-type').value = e.type;
            document.getElementById('f-note').value = e.note || '';
            document.getElementById('panel-title').textContent = `✏️ Eintrag bearbeiten – ${rooms[e.roomIndex]}`;
            document.getElementById('entry-panel').classList.add('open');
            document.getElementById('entry-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function closePanel() {
            document.getElementById('entry-panel').classList.remove('open');
            editingEntryId = null;
        }

        async function saveEntry() {
            const roomIdx = parseInt(document.getElementById('f-room').value);
            const from = document.getElementById('f-from').value;
            const to = document.getElementById('f-to').value;
            const type = document.getElementById('f-type').value;
            const note = document.getElementById('f-note').value.trim();

            if (!from || !to) { showToast('⚠️ Bitte Von- und Bis-Datum ausfüllen!'); return; }
            if (from > to) { showToast('⚠️ Startdatum muss vor Enddatum liegen!'); return; }

            const { collection, addDoc, doc, updateDoc, serverTimestamp } = window._firebaseFns;
            const payload = {
                roomIndex: roomIdx, roomName: rooms[roomIdx],
                from, to, type, note,
                lastEditedBy: currentUser,
                lastEditedAt: serverTimestamp()
            };

            if (editingEntryId) {
                await updateDoc(doc(window._db, 'calendar_entries', editingEntryId), payload);
                showToast('✅ Eintrag aktualisiert!');
            } else {
                await addDoc(collection(window._db, 'calendar_entries'), payload);
                showToast('✅ Eintrag gespeichert!');
            }

            editingEntryId = null;
            closePanel();
            await loadEntries();
        }

        async function deleteEntry(id) {
            if (!confirm('🗑️ Eintrag wirklich löschen?')) return;
            const { doc, deleteDoc } = window._firebaseFns;
            await deleteDoc(doc(window._db, 'calendar_entries', id));
            showToast('🗑️ Eintrag gelöscht.');
            await loadEntries();
        }

        async function loadEntries() {
            const { collection, getDocs, query, orderBy } = window._firebaseFns;
            const q = query(collection(window._db, 'calendar_entries'), orderBy('from'));
            const snap = await getDocs(q);
            allEntries = [];
            snap.forEach(d => allEntries.push({ id: d.id, ...d.data() }));
            renderCalendar();
            renderOverview();
        }

        function renderOverview() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            document.getElementById('overview-title').textContent = `📋 Alle Einträge – ${MONTH_NAMES[month]} ${year}`;

            const body = document.getElementById('overview-body');
            body.innerHTML = '';

            rooms.forEach((roomName, rIdx) => {
                const mStart = new Date(year, month, 1);
                const mEnd = new Date(year, month + 1, 0);

                const roomEntries = allEntries.filter(e => {
                    if (e.roomIndex !== rIdx) return false;
                    return new Date(e.from) <= mEnd && new Date(e.to) >= mStart;
                });

                const section = document.createElement('div');
                section.className = 'overview-room';
                section.innerHTML = `<div class="overview-room-name">🚪 ${roomName}</div>`;

                if (roomEntries.length === 0) {
                    section.innerHTML += `<div class="no-ov-entries">Keine Einträge diesen Monat.</div>`;
                } else {
                    roomEntries.forEach(entry => {
                        const sameDay = entry.from === entry.to;
                        const dateStr = sameDay
                            ? formatDate(entry.from)
                            : `${formatDate(entry.from)} → ${formatDate(entry.to)}`;

                        let metaStr = '';
                        if (entry.lastEditedBy) {
                            const ts = entry.lastEditedAt?.toDate ? entry.lastEditedAt.toDate() : null;
                            metaStr = `✏️ ${entry.lastEditedBy}` + (ts ? ' · ' + ts.toLocaleString('de-DE') : '');
                        }

                        const card = document.createElement('div');
                        card.className = `ov-entry-card type-${entry.type}`;
                        card.innerHTML = `
                                <div class="ov-info">
                                    <div class="ov-badge type-${entry.type}">${typeLabel(entry.type)}</div>
                                    <div class="ov-dates">${dateStr}</div>
                                    ${entry.note ? `<div class="ov-note">📝 ${entry.note}</div>` : ''}
                                    <div class="ov-meta">${metaStr}</div>
                                </div>
                                <div class="ov-actions">
                                    <button class="btn-ov-edit" onclick="openEditPanel('${entry.id}')">✏️ Bearbeiten</button>
                                    <button class="btn-ov-del"  onclick="deleteEntry('${entry.id}')">🗑️</button>
                                </div>`;
                        section.appendChild(card);
                    });
                }
                body.appendChild(section);
            });
        }

        function typeLabel(t) {
            return { belegt: '🔴 Belegt', frei: '🟢 Frei', besuch: '🟠 Besuch' }[t] || t;
        }
        function formatDate(str) {
            if (!str) return '–';
            const [y, m, d] = str.split('-');
            return `${d}.${m}.${y}`;
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }
        function logout() {
            sessionStorage.clear();
            localStorage.clear();
            window.location.href = 'start.html';
        }

        document.addEventListener('firebaseReady', init);
        if (window._firebaseReady) init();
    </script>
</body>
</html>
