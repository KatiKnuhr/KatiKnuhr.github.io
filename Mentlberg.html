<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Willkommen – Kati Knuhr</title>
    <link rel="icon" type="image/jpeg" href="Ice.jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Medien/Eis.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
        }

        .login-box {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 24px;
            padding: 50px 44px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

            .login-box h1 {
                color: white;
                font-size: 36px;
                font-weight: 800;
                letter-spacing: 3px;
                margin-bottom: 8px;
                text-shadow: 1px 1px 8px rgba(0,0,0,0.5);
            }

            .login-box p {
                color: rgba(255,255,255,0.75);
                font-size: 15px;
                margin-bottom: 36px;
                font-style: italic;
            }

            .login-box input {
                width: 100%;
                padding: 14px 18px;
                border-radius: 12px;
                border: 1px solid rgba(255,255,255,0.3);
                background: rgba(255,255,255,0.15);
                color: white;
                font-size: 16px;
                margin-bottom: 16px;
                outline: none;
                transition: border 0.3s;
            }

                .login-box input::placeholder {
                    color: rgba(255,255,255,0.6);
                }

                .login-box input:focus {
                    border-color: #a8d8ea;
                }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #2c6e8a, #a8d8ea);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-top: 8px;
        }

            .login-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(44,110,138,0.5);
            }

        .error-msg {
            color: #ff8a8a;
            font-size: 14px;
            margin-top: 14px;
            display: none;
        }

        .login-box .hint {
            color: rgba(255,255,255,0.45);
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="login-box">
        <h1>Kati Knuhr</h1>
        <p>Abenteurerin · Sportmanagement · Innsbruck</p>

        <input type="text" id="username" placeholder="Benutzername" />
        <input type="password" id="password" placeholder="Passwort" />
        <button class="login-btn" onclick="doLogin()">Anmelden</button>

        <div class="error-msg" id="error-msg">❌ Falscher Benutzername oder Passwort</div>
        <p class="hint">Nur für eingeladene Besucher</p>
    </div>

    <script>
        // Wenn schon eingeloggt, direkt weiterleiten
        if (sessionStorage.getItem('kati_logged_in') === 'true') {
            window.location.href = 'index.html';
        }

        function doLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // ✏️ Hier Benutzername und Passwort festlegen:
            const correctUser = 'kati';
            const correctPass = 'ibk';

            if (user === correctUser && pass === correctPass) {
                sessionStorage.setItem('kati_logged_in', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // Enter-Taste funktioniert auch
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    </script>

</body>
</html>
