<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentlberg-WG</title>
    <link rel="icon" type="image/jpeg" href="Ice.jpeg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-image: url('Medien/Eis.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.7));
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding-top: 80px;
        }

        .title {
            color: white;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 3px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.6);
        }

        .mountain {
            font-size: 52px;
            margin-left: 12px;
        }
    </style>
</head>
<body>

    <!-- Login-Schutz -->
    <script>
        if (sessionStorage.getItem('kati_logged_in') !== 'true') {
            window.location.href = 'start.html';
        }
    </script>

    <div class="overlay"></div>

    <div class="content">
        <h1 class="title">
            Willkommen bei der Mentlberg-WG
            <span class="mountain">⛰️</span>
        </h1>
    </div>

</body>
</html>
